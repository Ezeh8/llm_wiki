[project]
name = "llm-wiki"
version = "1.0.0"
description = "Production RAG knowledge base for enterprise SOPs"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "qdrant-client>=1.9",
    "anthropic>=0.40",
    "openai>=1.40",
    "PyMuPDF>=1.24",
    "python-docx>=1.1",
    "tiktoken>=0.7",
    "sentence-transformers>=3.0",
    "einops>=0.7",
    "fastembed>=0.3",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
    "langchain_core==1.5.3",
    "langsmith==0.10.16",
    "psycopg[binary]>=3.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
